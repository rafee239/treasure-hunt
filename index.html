<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resort Treasure Hunt</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 18px;
            padding: 24px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.75);
            border-top: 6px solid #00d2ff;
            transition: border-color 0.3s ease;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .zone-badge {
            background-color: #00d2ff;
            color: #000;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .zone-type {
            font-size: 12px;
            color: #b0b0b0;
            font-weight: 700;
        }
        h1 { margin: 4px 0 18px 0; font-size: 24px; }
        .prompt-label {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .team-btn {
            padding: 12px 6px;
            border: 2px solid transparent;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-btn:active { transform: scale(0.95); }
        .btn-red { background-color: #e53935; color: #fff; }
        .btn-white { background-color: #f5f5f5; color: #111; }
        .btn-blue { background-color: #1e88e5; color: #fff; }
        .btn-green { background-color: #43a047; color: #fff; }
        .btn-yellow { background-color: #fdd835; color: #111; }
        .team-btn.dimmed { opacity: 0.4; }
        .team-btn.selected { opacity: 1; border-color: #ffffff; transform: scale(1.04); }

        .result-area { display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .box {
            background-color: #282828;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #9e9e9e;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .code-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-text {
            font-size: 24px;
            font-weight: 800;
            color: #ffcc00;
            letter-spacing: 2px;
        }
        .copy-btn {
            background-color: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .task-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .task-desc {
            font-size: 14.5px;
            line-height: 1.5;
            color: #e0e0e0;
        }
        .proof-box {
            background-color: #1b2e26;
            border-left: 4px solid #00e676;
            padding: 14px;
            border-radius: 10px;
            margin-top: 14px;
        }
        .proof-title {
            font-size: 12px;
            font-weight: 800;
            color: #00e676;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }
        .proof-text {
            font-size: 13.5px;
            color: #d7f5e5;
            line-height: 1.45;
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="header-row">
        <span class="zone-badge" id="zone-badge">LOADING...</span>
        <span class="zone-type" id="zone-type"></span>
    </div>
    <h1 id="zone-title">Resort Treasure Hunt</h1>

    <div id="selector-section">
        <div class="prompt-label">👇 Select your Team Name to reveal your task:</div>
        <div class="team-grid">
            <button class="team-btn btn-red" onclick="selectTeam('red', '#e53935', this)">Team Red</button>
            <button class="team-btn btn-white" onclick="selectTeam('white', '#f5f5f5', this)">Team White</button>
            <button class="team-btn btn-blue" onclick="selectTeam('blue', '#1e88e5', this)">Team Blue</button>
            <button class="team-btn btn-green" onclick="selectTeam('green', '#43a047', this)">Team Green</button>
            <button class="team-btn btn-yellow" onclick="selectTeam('yellow', '#fdd835', this)">Team Yellow</button>
        </div>
    </div>

    <div class="result-area" id="result-area">
        <div class="box">
            <div class="label">Step 1: Your Zone Secret Code</div>
            <div class="code-row">
                <span class="code-text" id="secret-code">---</span>
                <button class="copy-btn" id="copy-btn" onclick="copyCode()">Copy</button>
            </div>
        </div>

        <div class="box">
            <div class="label">Step 2: Your Team Activity</div>
            <div class="task-title" id="task-title">---</div>
            <div class="task-desc" id="task-desc">---</div>
        </div>

        <div class="proof-box">
            <div class="proof-title">✅ Proof & Next Clue Instructions</div>
            <div class="proof-text" id="proof-text">---</div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // MASTER HUNT DATA (EDIT ZONE NAMES, CODES, OR ACTIVITIES ANYTIME)
    // =========================================================================
    const huntData = {
        "1": {
            title: "Zone 1",
            type: "⚡ ACTION ZONE",
            teams: {
                red: {
                    code: "R1-FALCON",
                    name: "Album Cover Pose",
                    desc: "Stand spaced apart at different angles looking away from the camera like a serious music band album cover.",
                    proof: "Capture 1 clear GROUP PHOTO showing all 8 members. Show the photo and tell code R1-FALCON to the Organiser to unlock your next clue."
                },
                white: {
                    code: "W1-PEARL",
                    name: "Forced Perspective Giant",
                    desc: "1 teammate stands close to the camera holding their hand out, while the other 7 stand far back so it looks like they are standing on the giant's palm.",
                    proof: "Capture 1 clear GROUP PHOTO of the optical illusion. Show the photo and tell code W1-PEARL to the Organiser to unlock your next clue."
                },
                blue: {
                    code: "B1-TIDE",
                    name: "Shadow Art",
                    desc: "Stand in a line and use your hands/arms to cast a cool shadow pattern (like a wave, bird, or mountain) on the ground or wall.",
                    proof: "Capture 1 clear PHOTO of your team's shadow art. Show the photo and tell code B1-TIDE to the Organiser to unlock your next clue."
                },
                green: {
                    code: "G1-LEAF",
                    name: "Nature Frame",
                    desc: "Find a fallen leaf or flower with a hole/curve, hold it near the camera lens, and frame all 8 smiling faces inside it.",
                    proof: "Capture 1 clear GROUP PHOTO framed through the leaf/flower. Show the photo and tell code G1-LEAF to the Organiser to unlock your next clue."
                },
                yellow: {
                    code: "Y1-SOLAR",
                    name: "Cool Action-Hero Pose",
                    desc: "Everyone puts on sunglasses (or makes hand-glasses around their eyes) and strikes their best Bollywood/action-hero pose.",
                    proof: "Capture 1 clear GROUP PHOTO showing all 8 members. Show the photo and tell code Y1-SOLAR to the Organiser to unlock your next clue."
                }
            }
        },
        "2": {
            title: "Zone 2",
            type: "⚡ ACTION ZONE",
            teams: {
                red: {
                    code: "R2-EMBER",
                    name: "15-Second Team Jingle",
                    desc: "Make up a 2-line rhyme or cheer hyping up Team Red and chant it together energetically.",
                    proof: "Record a 15-SECOND VIDEO of all 8 members chanting. Show the video and tell code R2-EMBER to the Organiser to unlock your next clue."
                },
                white: {
                    code: "W2-IVORY",
                    name: "Sound Effects Story",
                    desc: "1 teammate narrates a dramatic 15-second story ('A lion chased us into the resort!') while the other 7 make all background sound effects (wind, footsteps, roars).",
                    proof: "Record a 15-SECOND VIDEO with clear audio. Show the video and tell code W2-IVORY to the Organiser to unlock your next clue."
                },
                blue: {
                    code: "B2-CORAL",
                    name: "Human Beatbox",
                    desc: "Each member makes a different rhythmic sound (claps, snaps, hums, beats) one by one until all 8 are harmonizing together for 10 seconds.",
                    proof: "Record a 15-SECOND VIDEO of the rhythm. Show the video and tell code B2-CORAL to the Organiser to unlock your next clue."
                },
                green: {
                    code: "G2-FERN",
                    name: "Hype Commentary",
                    desc: "Do a cricket-style live commentary describing your team walking toward the camera as if you just won the World Cup.",
                    proof: "Record a 15-SECOND VIDEO of the walk and commentary. Show the video and tell code G2-FERN to the Organiser to unlock your next clue."
                },
                yellow: {
                    code: "Y2-AMBER",
                    name: "Tongue-Twister Relay",
                    desc: "Stand in a line and have each person say 'Red lorry, yellow lorry' 3 times fast, passing it down the line without stumbling.",
                    proof: "Record 1 CONTINUOUS VIDEO of all 8 members completing it. Show the video and tell code Y2-AMBER to the Organiser to unlock your next clue."
                }
            }
        },
        "3": {
            title: "Zone 3",
            type: "🚀 EXPRESS CHECKPOINT",
            teams: {
                red:    { code: "R3-RUBY",   name: "Landmark Check-In", desc: "Quick sprint checkpoint! Gather your team in front of the Zone 3 landmark.", proof: "Take 1 GROUP SELFIE clearly showing the Zone 3 landmark behind you. Show it with code R3-RUBY to the Organiser for your next clue." },
                white:  { code: "W3-FROST",  name: "Landmark Check-In", desc: "Quick sprint checkpoint! Gather your team in front of the Zone 3 landmark.", proof: "Take 1 GROUP SELFIE clearly showing the Zone 3 landmark behind you. Show it with code W3-FROST to the Organiser for your next clue." },
                blue:   { code: "B3-MARINE", name: "Landmark Check-In", desc: "Quick sprint checkpoint! Gather your team in front of the Zone 3 landmark.", proof: "Take 1 GROUP SELFIE clearly showing the Zone 3 landmark behind you. Show it with code B3-MARINE to the Organiser for your next clue." },
                green:  { code: "G3-MOSS",   name: "Landmark Check-In", desc: "Quick sprint checkpoint! Gather your team in front of the Zone 3 landmark.", proof: "Take 1 GROUP SELFIE clearly showing the Zone 3 landmark behind you. Show it with code G3-MOSS to the Organiser for your next clue." },
                yellow: { code: "Y3-GOLD",   name: "Landmark Check-In", desc: "Quick sprint checkpoint! Gather your team in front of the Zone 3 landmark.", proof: "Take 1 GROUP SELFIE clearly showing the Zone 3 landmark behind you. Show it with code Y3-GOLD to the Organiser for your next clue." }
            }
        },
        "4": {
            title: "Zone 4",
            type: "⚡ ACTION ZONE",
            teams: {
                red: {
                    code: "R4-BLAZE",
                    name: "A-to-H Category Sprint",
                    desc: "Name 1 city, fruit, or movie for each letter from A to H (1 letter per teammate, in strict alphabetical order).",
                    proof: "Record a VIDEO (under 20 seconds) of all 8 members completing A to H. Show the video and tell code R4-BLAZE to the Organiser."
                },
                white: {
                    code: "W4-CLOUD",
                    name: "Reverse Countdown",
                    desc: "Count backward from 40 down to 1, alternating 1 number per teammate without two people speaking at the same time.",
                    proof: "Record a VIDEO (under 20 seconds) of the full countdown. Show the video and tell code W4-CLOUD to the Organiser."
                },
                blue: {
                    code: "B4-COBALT",
                    name: "Last-Letter Word Chain",
                    desc: "Start with 'RESORT'. Each teammate says a new word starting with the last letter of the previous word (Resort → Tiger → River...) across all 8 members.",
                    proof: "Record a VIDEO (under 20 seconds) of all 8 words. Show the video and tell code B4-COBALT to the Organiser."
                },
                green: {
                    code: "G4-PINE",
                    name: "10-Item Vacation Sprint",
                    desc: "Shout out 10 distinct things you pack for a vacation in under 15 seconds (every teammate must name at least one item).",
                    proof: "Record a 15-SECOND VIDEO of the team calling out all 10 items. Show the video and tell code G4-PINE to the Organiser."
                },
                yellow: {
                    code: "Y4-SUNNY",
                    name: "Movie Title Relay",
                    desc: "Without repeating any lead actor, all 8 teammates must name 1 hit movie each in under 15 seconds.",
                    proof: "Record a 15-SECOND VIDEO of all 8 movie names. Show the video and tell code Y4-SUNNY to the Organiser."
                }
            }
        },
        "5": {
            title: "Zone 5",
            type: "🚀 EXPRESS CHECKPOINT",
            teams: {
                red:    { code: "R5-CRIMSON", name: "Shocked Face Selfie", desc: "Quick sprint checkpoint! Gather at Zone 5 and make your funniest shocked/surprised faces.", proof: "Take 1 GROUP SELFIE at Zone 5. Show it with code R5-CRIMSON to the Organiser for your next clue." },
                white:  { code: "W5-CHALK",   name: "Shocked Face Selfie", desc: "Quick sprint checkpoint! Gather at Zone 5 and make your funniest shocked/surprised faces.", proof: "Take 1 GROUP SELFIE at Zone 5. Show it with code W5-CHALK to the Organiser for your next clue." },
                blue:   { code: "B5-AZURE",   name: "Shocked Face Selfie", desc: "Quick sprint checkpoint! Gather at Zone 5 and make your funniest shocked/surprised faces.", proof: "Take 1 GROUP SELFIE at Zone 5. Show it with code B5-AZURE to the Organiser for your next clue." },
                green:  { code: "G5-JADE",    name: "Shocked Face Selfie", desc: "Quick sprint checkpoint! Gather at Zone 5 and make your funniest shocked/surprised faces.", proof: "Take 1 GROUP SELFIE at Zone 5. Show it with code G5-JADE to the Organiser for your next clue." },
                yellow: { code: "Y5-LEMON",   name: "Shocked Face Selfie", desc: "Quick sprint checkpoint! Gather at Zone 5 and make your funniest shocked/surprised faces.", proof: "Take 1 GROUP SELFIE at Zone 5. Show it with code Y5-LEMON to the Organiser for your next clue." }
            }
        },
        "6": {
            title: "Zone 6",
            type: "⚡ ACTION ZONE",
            teams: {
                red: {
                    code: "R6-FLAME",
                    name: "Red Item Lineup",
                    desc: "Gather 8 red items currently worn or carried by your team (wrist ribbons, shoes, phone covers, pens, etc.) and arrange them neatly in a row.",
                    proof: "Take 1 clear PHOTO of all 8 red items lined up. Show the photo and tell code R6-FLAME to the Organiser."
                },
                white: {
                    code: "W6-SNOW",
                    name: "4-Letter Object Spell",
                    desc: "Place 4 items you have with you in a row whose first letters spell a 4-letter English word (e.g., Watch, Apple, Tissue, Cap = W-A-T-C).",
                    proof: "Take 1 clear PHOTO of the 4 items in order. Show the photo and tell code W6-SNOW to the Organiser."
                },
                blue: {
                    code: "B6-OCEAN",
                    name: "Blind Height-Order Lineup",
                    desc: "Stand spaced apart with eyes closed and, using verbal instructions only, arrange yourselves from shortest to tallest in under 20 seconds.",
                    proof: "Record a 20-SECOND VIDEO of the lineup. Show the video and tell code B6-OCEAN to the Organiser."
                },
                green: {
                    code: "G6-CLOVER",
                    name: "Nature Smiley Collage",
                    desc: "Collect fallen leaves, twigs, or pebbles from the ground (do not pluck live plants!) and arrange them into a smiley face on the path.",
                    proof: "Take 1 clear PHOTO of your nature smiley. Show the photo and tell code G6-CLOVER to the Organiser."
                },
                yellow: {
                    code: "Y6-TOPAZ",
                    name: "Accessory Starburst",
                    desc: "Everyone places 1 personal accessory (sunglasses, watch, cap, or shoe) on the ground to form a neat 8-point star/circle.",
                    proof: "Take 1 clear PHOTO of the 8-item starburst. Show the photo and tell code Y6-TOPAZ to the Organiser."
                }
            }
        },
        "7": {
            title: "Zone 7",
            type: "⚡ ACTION ZONE",
            teams: {
                red: {
                    code: "R7-SPARK",
                    name: "Mannequin Freeze",
                    desc: "Everyone stands in a fun everyday pose (checking phone, pointing, laughing) completely frozen like statues while 1 teammate pans the camera around.",
                    proof: "Record a 10-SECOND VIDEO showing everyone frozen without moving. Show the video and tell code R7-SPARK to the Organiser."
                },
                white: {
                    code: "W7-LILY",
                    name: "Red Carpet Walk",
                    desc: "7 teammates stand on the sides clapping and cheering like fans while 1 teammate does a dramatic celebrity walk down the middle.",
                    proof: "Record a 15-SECOND VIDEO of the red carpet walk. Show the video and tell code W7-LILY to the Organiser."
                },
                blue: {
                    code: "B7-SAPPHIRE",
                    name: "Silent Movie Charades",
                    desc: "7 teammates act out a famous movie silently for 15 seconds while 1 teammate guesses the movie name on camera.",
                    proof: "Record a 15-SECOND VIDEO showing the acting and correct guess. Show the video and tell code B7-SAPPHIRE to the Organiser."
                },
                green: {
                    code: "G7-OLIVE",
                    name: "Resort TV Commercial",
                    desc: "Create a 15-second enthusiastic TV ad convincing viewers why this resort is the #1 holiday spot in India.",
                    proof: "Record a 15-SECOND VIDEO of your team commercial. Show the video and tell code G7-OLIVE to the Organiser."
                },
                yellow: {
                    code: "Y7-FLARE",
                    name: "Emoji Expression Grid",
                    desc: "Stand together and have every single teammate mimic a completely different emoji face (😂 😎 😱 🤔 🥳 🙄 😴 🤩).",
                    proof: "Take 1 clear GROUP PHOTO showing all 8 distinct faces. Show the photo and tell code Y7-FLARE to the Organiser."
                }
            }
        },
        "8": {
            title: "Zone 8",
            type: "🏁 FINAL CHECKPOINT",
            teams: {
                red:    { code: "R8-SCARLET", name: "Final Victory Check-In", desc: "Final checkpoint reached! Gather your team for a victory thumbs-up photo.", proof: "Take 1 GROUP PHOTO at Zone 8 and sprint back to the Organiser with code R8-SCARLET to claim your final puzzle piece!" },
                white:  { code: "W8-CREST",   name: "Final Victory Check-In", desc: "Final checkpoint reached! Gather your team for a victory thumbs-up photo.", proof: "Take 1 GROUP PHOTO at Zone 8 and sprint back to the Organiser with code W8-CREST to claim your final puzzle piece!" },
                blue:   { code: "B8-NAVY",    name: "Final Victory Check-In", desc: "Final checkpoint reached! Gather your team for a victory thumbs-up photo.", proof: "Take 1 GROUP PHOTO at Zone 8 and sprint back to the Organiser with code B8-NAVY to claim your final puzzle piece!" },
                green:  { code: "G8-EMERALD", name: "Final Victory Check-In", desc: "Final checkpoint reached! Gather your team for a victory thumbs-up photo.", proof: "Take 1 GROUP PHOTO at Zone 8 and sprint back to the Organiser with code G8-EMERALD to claim your final puzzle piece!" },
                yellow: { code: "Y8-CROWN",   name: "Final Victory Check-In", desc: "Final checkpoint reached! Gather your team for a victory thumbs-up photo.", proof: "Take 1 GROUP PHOTO at Zone 8 and sprint back to the Organiser with code Y8-CROWN to claim your final puzzle piece!" }
            }
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const zoneId = urlParams.get('zone');

    if (zoneId && huntData[zoneId]) {
        document.getElementById('zone-badge').innerText = "ZONE " + zoneId;
        document.getElementById('zone-type').innerText = huntData[zoneId].type;
        document.getElementById('zone-title').innerText = huntData[zoneId].title;
    } else {
        document.getElementById('zone-badge').innerText = "INVALID QR";
        document.getElementById('zone-title').innerText = "Zone Not Found";
        document.getElementById('selector-section').style.display = "none";
    }

    function selectTeam(teamKey, borderColor, clickedBtn) {
        if (!zoneId || !huntData[zoneId]) return;
        const data = huntData[zoneId].teams[teamKey];

        document.querySelectorAll('.team-btn').forEach(btn => {
            btn.classList.remove('selected');
            btn.classList.add('dimmed');
        });
        clickedBtn.classList.remove('dimmed');
        clickedBtn.classList.add('selected');

        document.getElementById('main-card').style.borderTopColor = borderColor;
        document.getElementById('secret-code').innerText = data.code;
        document.getElementById('task-title').innerText = data.name;
        document.getElementById('task-desc').innerText = data.desc;
        document.getElementById('proof-text').innerText = data.proof;
        document.getElementById('copy-btn').innerText = "Copy";
        document.getElementById('result-area').style.display = "block";
    }

    function copyCode() {
        const codeText = document.getElementById('secret-code').innerText;
        navigator.clipboard.writeText(codeText);
        document.getElementById('copy-btn').innerText = "Copied!";
    }
</script>

</body>
</html>
